name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  #packages: write

env:
  #REGISTRY: ghcr.io
  DEPLOY_HOST: 109.202.59.96
  DEPLOY_USER: alexware
  DEPLOY_PORT: 456
  DEPLOY_PATH: /home/alexware/workspace/os-labs/lab4/devops-lab-service
  IMAGE_NAME: devops-lab-service-ci

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Run container and check application
        run: |
          docker rm -f devops-lab-ci-test 2>/dev/null || true

          docker run -d \
            --name devops-lab-ci-test \
            -p 8000:8000 \
            "$IMAGE_NAME:${{ github.sha }}"

          echo "Waiting for test container to become ready..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8000/; then
              echo "Test container is ready"
              break
            fi

            echo "Test container is not ready yet. Attempt $i/30"
            sleep 2

            if [ "$i" -eq 30 ]; then
              echo "Test container did not become ready in time"
              docker logs devops-lab-ci-test --tail 100
              docker rm -f devops-lab-ci-test
              exit 1
            fi
          done

          echo "Checking endpoints..."
          curl -fsS http://localhost:8000/
          curl -fsS -X POST http://localhost:8000/tasks
          curl -fsS http://localhost:8000/tasks
          curl -fsS -X POST http://localhost:8000/tasks/0/process
          curl -fsS http://localhost:8000/metrics | head

          docker rm -f devops-lab-ci-test

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key 
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" << EOF
            set -e

            cd "$DEPLOY_PATH"

            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}

            docker compose -f docker/docker-compose.yml up -d --build

            docker compose -f docker/docker-compose.yml ps

            echo "Waiting for deployed application to become ready..."

            for i in {1..30}; do
              if curl -fsS http://localhost:8000/; then
                echo "Application is ready"
                break
              fi

              echo "Application is not ready yet. Attempt \$i/30"
              sleep 2

              if [ "\$i" -eq 30 ]; then
                echo "Application did not become ready in time"
                docker logs devops-lab-app --tail 100
                exit 1
              fi
            done

            echo "Checking metrics endpoint..."
            curl -fsS http://localhost:8000/metrics | head

            echo "Checking Prometheus..."
            curl -fsS http://localhost:9090/-/ready

            docker image prune -f
          EOF